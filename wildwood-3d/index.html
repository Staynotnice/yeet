<!doctype html>

<meta name="theme-color" content="#14271f"><title>Wildwood: The Last Ember — 3D Adventure</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#14271f;color:#f1efdd;font:14px system-ui,sans-serif}canvas{display:block}#ui{position:fixed;inset:0;pointer-events:none}header{position:absolute;top:16px;left:18px;right:18px;display:flex;justify-content:space-between;text-shadow:0 2px 8px #000}b{letter-spacing:.16em}small{display:block;color:#c1cbb9;font-size:10px;letter-spacing:.12em}.panel{background:#10251fdc;border:1px solid #e6cb8655;border-radius:12px;padding:13px;backdrop-filter:blur(8px)}#quest{position:absolute;top:75px;left:18px;width:245px}#quest h3{margin:7px 0;font-size:15px}#quest p{font-size:12px;line-height:1.6;color:#d4ddce;margin:6px 0}#count{color:#e6cb86}#hint{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:11px}#toast{position:absolute;top:25%;left:50%;transform:translateX(-50%);background:#10251ff0;border:1px solid #e6cb86;border-radius:9px;padding:12px 16px;opacity:0;transition:opacity .2s;max-width:90vw;text-align:center}#toast.on{opacity:1}#dialog{position:absolute;bottom:70px;left:50%;transform:translateX(-50%);width:min(520px,calc(100vw - 24px));pointer-events:auto}#dialog[hidden],#ending[hidden]{display:none}#dialog p,#ending p{line-height:1.7;color:#d4ddce}button{border:1px solid #e6cb86aa;background:#e6cb861c;color:#fff5d8;padding:10px 12px;border-radius:8px;cursor:pointer;margin:4px;font:inherit}button:hover{background:#e6cb8644}#choices{display:flex;flex-wrap:wrap}#ending{position:absolute;inset:0;display:grid;place-items:center;background:#06150ec9;pointer-events:auto}#ending article{max-width:420px;margin:18px;padding:28px;background:#14271f;border:1px solid #e6cb86;border-radius:16px;text-align:center}.mobile{display:none;position:absolute;bottom:12px;left:10px;right:10px;justify-content:space-between;align-items:end;pointer-events:auto}.pad button{width:43px;height:42px}.pad>button{display:block;margin:auto}.pad div{display:flex}.mobile .actions{display:flex;flex-direction:column}@media(max-width:650px){#quest{top:66px;left:10px;width:calc(100vw - 20px);padding:10px}#quest h3{font-size:13px;margin:4px 0}#quest p{font-size:10px;margin:3px 0}#hint{display:none}.mobile{display:flex}#dialog{bottom:8px}#dialog p{font-size:12px}#choices button{flex:1;min-width:44%}}
</style>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
</head>
<body><div id="ui"><header><div>✦ <b>WILDWOOD</b><small>THE LAST EMBER</small></div><small>OPEN-WORLD STORY ADVENTURE</small></header><section id="quest" class="panel"><small>YOUR JOURNEY</small><h3 id="title">A Forest Without Song</h3><p id="desc">Find the three lost embers hidden in the forest.</p><p id="count">ANCIENT EMBERS: 0 / 3</p></section><div id="toast"></div><section id="dialog" class="panel" hidden><small id="speaker">ELDER ROWAN</small><p id="words"></p><div id="choices"></div></section><section id="ending" hidden><article><div style="font-size:36px;color:#e6cb86">✦</div><small>THE STORY CONTINUES</small><h2 id="endtitle">The Pact Renewed</h2><p id="endcopy"></p><button id="continue">Keep exploring</button></article></section><div id="hint" class="panel">WASD / ARROWS MOVE · SHIFT RUN · E TALK / COLLECT · SPACE JUMP</div><div class="mobile"><div class="pad"><button data-m="f">▲</button><div><button data-m="l">◀</button><button data-m="b">▼</button><button data-m="r">▶</button></div></div><div class="actions"><button id="run">RUN</button><button id="talk">TALK / COLLECT</button><button id="jump">JUMP</button></div></div></div>
<script>
(()=>{if(!window.THREE){document.getElementById('toast').textContent='3D engine could not load. Check your internet connection.';document.getElementById('toast').classList.add('on');return}
const $=id=>document.getElementById(id),scene=new THREE.Scene();scene.background=new THREE.Color(0x9dbab0);scene.fog=new THREE.FogExp2(0x9dbab0,.008);
const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,250),renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));renderer.shadowMap.enabled=true;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.08;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xe7f4dd,0x30412d,2));const sun=new THREE.DirectionalLight(0xffdfaa,3);sun.position.set(-25,35,18);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);
const mat=(c)=>new THREE.MeshStandardMaterial({color:c,roughness:.9}),grass=mat(0x527b50),leaf=[mat(0x28563d),mat(0x356b48),mat(0x47774d)],bark=mat(0x60462f),stone=mat(0x89917d),gold=new THREE.MeshStandardMaterial({color:0xf3c95d,emissive:0x9e6510,emissiveIntensity:1.4}),skin=mat(0xd8b98a),cloth=mat(0x876d4c),blue=mat(0x658c85);
function add(g,m,x,y,z,parent=scene){const o=new THREE.Mesh(g,m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}
const box=new THREE.BoxGeometry(1,1,1),cone=new THREE.ConeGeometry(1,1,7),sphere=new THREE.SphereGeometry(1,8,6);
let floor=add(new THREE.PlaneGeometry(150,150),grass,0,-.3,0);floor.rotation.x=-Math.PI/2;
for(let i=0;i<180;i++){let x=(Math.random()-.5)*130,z=(Math.random()-.5)*130;if(Math.hypot(x,z)<9)continue;let h=2.5+Math.random()*3;add(new THREE.CylinderGeometry(.18,.35,h*.5,6),bark,x,h*.25-.2,z);add(cone,leaf[i%3],x,h*.55+.2,z).scale.set(1.1+Math.random(),h*.55,1.1+Math.random());add(cone,leaf[(i+1)%3],x,h*.9+.1,z).scale.set(.75,h*.4,.75)}
// A winding pale trail and a small village camp
for(let i=0;i<28;i++){let z=16-i*1.65,x=Math.sin(i*.22)*3;let p=add(new THREE.CircleGeometry(1.25,6),mat(0xa99a70),x,-.14,z);p.rotation.x=-Math.PI/2}
for(let i=0;i<3;i++){let a=i*Math.PI*2/3;let x=Math.cos(a)*4,z=16+Math.sin(a)*3;add(box,cloth,x,.5,z).scale.set(1,.8,.08);let roof=add(cone,stone,x,1.2,z);roof.rotation.z=Math.PI;roof.scale.set(1.1,.7,1.1)}
const player=new THREE.Group();scene.add(player);add(box,blue,0,.85,0,player).scale.set(.62,.85,.4);add(sphere,skin,0,1.5,0,player).scale.set(.34,.34,.34);add(box,cloth,0,.3,0,player).scale.set(.72,.18,.45);
const elder=new THREE.Group();scene.add(elder);elder.position.set(1,0,12);add(box,cloth,0,.85,0,elder).scale.set(.7,.85,.45);add(sphere,skin,0,1.5,0,elder).scale.set(.34,.34,.34);add(sphere,gold,0,2.4,0,elder).scale.set(.13,.13,.13);
const spots=[{x:-18,z:-14,name:'Waystone'},{x:22,z:-25,name:'Watchtower'},{x:28,z:22,name:'Quiet Shrine'}],crystals=[],found=[false,false,false];
spots.forEach((s,i)=>{let group=new THREE.Group();group.position.set(s.x,0,s.z);scene.add(group);add(new THREE.CylinderGeometry(.7,.9,.5,6),stone,0,.15,0,group);add(new THREE.OctahedronGeometry(.65),gold,0,1.2,0,group);add(new THREE.PointLight(0xffbf4c,1.4,8),gold,0,1.4,0,group);crystals.push(group)});
const guardian=new THREE.Group();guardian.position.set(30,0,25);scene.add(guardian);add(box,leaf[0],0,1,0,guardian).scale.set(.8,1.4,.7);add(sphere,gold,0,2,0,guardian).scale.set(.4,.4,.4);
const keys={},touch={f:false,b:false,l:false,r:false};let x=0,z=19,y=0,vy=0,grounded=true,shards=0,story=0,dialog=false,run=false,finished=false,last=0,clock=new THREE.Clock();
function toast(t){$('toast').textContent=t;$('toast').classList.add('on');clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').classList.remove('on'),2400)}
function quest(){ $('count').textContent='ANCIENT EMBERS: '+shards+' / 3';$('title').textContent=story===0?'A Forest Without Song':story===1?'The Three Embers':story===2?'A Voice Beneath the Roots':'Wildwood Remembers';$('desc').textContent=story===0?'Speak with Elder Rowan at the village camp.':story<3?'Find the three ancient embers, then visit the Quiet Shrine.':'Your choice has changed the forest. Explore at your own pace.'}
function open(speaker,words,choices){dialog=true;$('dialog').hidden=false;$('speaker').textContent=speaker;$('words').textContent=words;$('choices').replaceChildren();choices.forEach(c=>{let b=document.createElement('button');b.textContent=c[0];b.onclick=c[1];$('choices').appendChild(b)})}
function close(){dialog=false;$('dialog').hidden=true}
function interact(){if(dialog){close();return}if(Math.hypot(x-elder.position.x,z-elder.position.z)<3.4&&story===0){open('ELDER ROWAN','The forest is losing its song. Three embers were scattered across Wildwood. Bring them to the Quiet Shrine, and choose whether to mend the old pact or let the forest begin again.',[['I will find the embers.',()=>{story=1;quest();close();toast('Journey begun: seek the golden lights.')}],['Tell me about the old pact.',()=>{open('ELDER ROWAN','Long ago, the forest held a grief too great to carry. The pact gave it roots, and those roots grew into every living thing.',[['I understand.',()=>{story=1;quest();close()}]])}]]);return}
for(let i=0;i<spots.length;i++)if(!found[i]&&Math.hypot(x-spots[i].x,z-spots[i].z)<3.5){found[i]=true;shards++;scene.remove(crystals[i]);quest();toast('EMBER FOUND · '+spots[i].name);if(shards===3){story=2;quest();toast('All three embers glow. Visit the Quiet Shrine.')}return}
if(shards===3&&Math.hypot(x-guardian.position.x,z-guardian.position.z)<5){open('THE ROOTKEEPER','Three lights in mortal hands. Will you mend the old pact and remember the past, or break the roots and let the forest begin again?', [['Mend the pact',()=>ending('The Pact Renewed','You chose to remember without being ruled by grief. The forest finds its song again, and a thousand mornings wait.')],['Break the roots',()=>ending('A Wild New Dawn','You release the forest from its oldest bond. There will be loss, but also wild new growth and a future unwritten.')]]);return}
toast('Explore the forest. Look for golden light and the elder at camp.')}
function ending(title,copy){close();finished=true;$('endtitle').textContent=title;$('endcopy').textContent=copy;$('ending').hidden=false;story=3;quest()}
$('continue').onclick=()=>{$('ending').hidden=true;finished=false;toast('Your journey continues, Wanderer.')};
addEventListener('keydown',e=>{let k=e.key.toLowerCase();keys[k]=true;if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(k))e.preventDefault();if(!e.repeat&&(k==='e'||k==='enter'))interact();if(!e.repeat&&k===' '&&grounded){vy=6;grounded=false}if(k==='escape')close()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);addEventListener('blur',()=>{Object.keys(keys).forEach(k=>keys[k]=false);run=false});
document.querySelectorAll('[data-m]').forEach(b=>{let k=b.dataset.m;b.onpointerdown=e=>{e.preventDefault();touch[k]=true};['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,()=>touch[k]=false))});$('run').onpointerdown=()=>run=true;['pointerup','pointercancel','pointerleave'].forEach(ev=>$('run').addEventListener(ev,()=>run=false));$('talk').onclick=interact;$('jump').onclick=()=>{if(grounded){vy=6;grounded=false}};
function animate(t){requestAnimationFrame(animate);let dt=Math.min(.04,(t-last)/1000||0);last=t;if(!dialog&&!finished){let f=(keys.w||keys.arrowup||touch.f?1:0)-(keys.s||keys.arrowdown||touch.b?1:0),r=(keys.d||keys.arrowright||touch.r?1:0)-(keys.a||keys.arrowleft||touch.l?1:0),len=Math.hypot(f,r);if(len){f/=len;r/=len;let speed=(keys.shift||run)?10:6;x=THREE.MathUtils.clamp(x+r*speed*dt,-65,65);z=THREE.MathUtils.clamp(z-f*speed*dt,-65,65);player.rotation.y=Math.atan2(r,-f)}vy-=14*dt;y+=vy*dt;if(y<=0){y=0;vy=0;grounded=true}player.position.set(x,y,z);player.children[0].position.y=.85+Math.sin(t*.01)*.025;crystals.forEach((c,i)=>{if(!found[i]){c.rotation.y+=dt*.7;c.children[1].position.y=1.2+Math.sin(t*.003+i)*.15}})}
let desired=new THREE.Vector3(x-player.rotation.y*0- Math.sin(player.rotation.y)*7,player.position.y+4.7,z+Math.cos(player.rotation.y)*7);camera.position.lerp(desired,1-Math.exp(-dt*4));camera.lookAt(x,y+1,z);renderer.render(scene,camera)}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});quest();toast('Find Elder Rowan at the village camp. Press E to speak.');requestAnimationFrame(animate);
})();
</script></body></html>
